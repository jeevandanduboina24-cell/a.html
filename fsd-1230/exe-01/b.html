<!DOCTYPE html>
<html>
<head>
    <title>HTML Hyperlinks</title>
</head>
<body>

    <h1>Working of Hyperlinks</h1>

    <p>Click the links below:</p>

    <!-- Opens in the same window -->
    <a href="https://www.google.com" target="_self">
        Open Google in Same Window
    </a>

    <br><br>

    <!-- Opens in a new window/tab -->
    <a href="https://www.wikipedia.org" target="_blank">
        Open Wikipedia in New Window
    </a>

    <br><br>

    <!-- Link to another HTML page -->
    <a href="about.html" target="_self">
        Open About Page
    </a>

</body>
</html>
